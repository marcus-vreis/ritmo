[package]
name = "ritmo"
version = "0.2.0"
description = "Agenda de rotinas e foco para o desktop"
edition = "2021"
license = "MIT"

[lib]
name = "ritmo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
nvml-wrapper = "0.13.0"
sysinfo = "0.39.6"
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
